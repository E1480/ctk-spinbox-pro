authors = [
    { name = "Julius Jovia Jr.", email = "that1480devguy@gmail.com" }
]
dependencies = [
    "customtkinter>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/yourname/ctk-spinbox"
